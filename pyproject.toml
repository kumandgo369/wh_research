[project]
name = "wh-research"
version = "0.1.0"
description = "Quant crypto research: Hyperliquid data pipelines and analysis"
readme = "README.md"
authors = [
    { email = "lamweiheng54@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "hyperliquid-python-sdk>=0.24.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
